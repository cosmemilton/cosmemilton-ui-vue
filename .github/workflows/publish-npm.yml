name: Publicar no npm

on:
  push:
    branches: [release]
    paths-ignore:
      - '.github/workflows/publish-npm.yml'

permissions:
  contents: read

concurrency:
  group: npm-publish-release
  queue: max

jobs:
  publish:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Consultar versão no npm
        id: version
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'))
          const registry = 'https://registry.npmjs.org'
          const url = `${registry}/${encodeURIComponent(name)}/${encodeURIComponent(version)}`
          const response = await fetch(url, { signal: AbortSignal.timeout(15000) })

          if (response.status === 200) {
            const published = await response.json()
            if (published.name !== name || published.version !== version) {
              throw new Error(`O npm retornou metadados inesperados para ${name}@${version}.`)
            }
            console.log(`${name}@${version} já está no npm. Incremente a versão para publicar outra revisão.`)
          } else if (response.status !== 404) {
            throw new Error(`Não foi possível consultar ${name}@${version} no npm (HTTP ${response.status}).`)
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `unpublished=${response.status === 404}\n`)
          NODE

      - name: Instalar dependências
        if: steps.version.outputs.unpublished == 'true'
        run: npm ci --include=dev

      - name: Compilar biblioteca
        if: steps.version.outputs.unpublished == 'true'
        run: npm run build

      - name: Publicar pacote
        if: steps.version.outputs.unpublished == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "$NODE_AUTH_TOKEN" ]]; then
            echo "::error::Configure o secret NPM_TOKEN para publicar no npm."
            exit 1
          fi
          npm publish --access public --ignore-scripts
